[project]
name = "rag-using-langraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rag-using-langraph = "rag_using_langraph:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
